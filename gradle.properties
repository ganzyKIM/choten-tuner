# WINDOWS-ROOT: use the Windows certificate store for TLS (this machine's
# security software intercepts SSL; its root CA is only in the Windows store)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djavax.net.ssl.trustStoreType=WINDOWS-ROOT
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
